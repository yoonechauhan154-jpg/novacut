appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Playhead Scrubber"
    timeout: 30000

- longPressOn:
    element:
      hasContentDescription: "Playhead Scrubber"
    duration: 500
    point:
      x: 40%
      y: 50%

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Playhead Scrubber"

- waitForTimeout: 1000

- screenshot:
    outputPath: playhead-drag.png

- assertVisible:
    element:
      hasContentDescription: "Playhead Scrubber"

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
