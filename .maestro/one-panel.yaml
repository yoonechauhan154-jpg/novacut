appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Text"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Text"

- waitForTimeout: 1000

- assertVisible:
    element:
      hasContentDescription: "Sticker"

- tapOn:
    element:
      hasContentDescription: "Sticker"

- waitForTimeout: 1000

- assertNotVisible:
    element:
      hasContentDescription: "Text"

- screenshot:
    outputPath: one-panel.png

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
