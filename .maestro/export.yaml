appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Export Video"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Export Video"

- waitForTimeout: 2000

- tapOn:
    element:
      hasText: "MP4"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Export"

- waitForTimeout: 5000

- screenshot:
    outputPath: export-done.png

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
