appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Play"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Play"

- waitForTimeout: 2000

- tapOn:
    element:
      hasContentDescription: "Split"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Play"

- waitForTimeout: 3000

- assertVisible:
    element:
      hasContentDescription: "Pause"

- screenshot:
    outputPath: split-play-across.png

- tapOn:
    element:
      hasContentDescription: "Pause"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Split"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Play"

- waitForTimeout: 3000

- assertVisible:
    element:
      hasContentDescription: "Pause"

- screenshot:
    outputPath: split-play-second-split.png

- tapOn:
    element:
      hasContentDescription: "Pause"

- tapOn:
    element:
      hasContentDescription: "Undo"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Play"

- waitForTimeout: 3000

- assertVisible:
    element:
      hasContentDescription: "Pause"

- screenshot:
    outputPath: split-play-after-undo.png

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
