appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Play"
    timeout: 30000

- assertVisible:
    element:
      hasContentDescription: "Play"

- screenshot:
    outputPath: new-project-editor.png

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
