appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Trim"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Trim"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Duplicate"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Delete"

- waitForTimeout: 1000

- screenshot:
    outputPath: edit-ops.png

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
