appId: com.clipnova.editor

- launchApp:
    clearState: true

- waitFor:
    element:
      hasText: "ClipNova"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "New Project"

- waitFor:
    element:
      hasContentDescription: "Browse Phone Gallery"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Browse Phone Gallery"

- waitFor:
    element:
      hasContentDescription: "Load test video (test mode)"
    timeout: 10000

- tapOn:
    element:
      hasContentDescription: "Load test video (test mode)"

- waitFor:
    element:
      hasContentDescription: "Text"
    timeout: 30000

- tapOn:
    element:
      hasContentDescription: "Text"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Sticker"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Adjustment"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Effect"

- waitForTimeout: 1000

- tapOn:
    element:
      hasContentDescription: "Transition"

- waitForTimeout: 1000

- screenshot:
    outputPath: features-all.png

- assertNotVisible:
    element:
      hasText: "Runtime Error Diagnostic"
