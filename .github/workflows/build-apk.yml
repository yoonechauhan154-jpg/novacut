name: Build ClipNova Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21 (Required for Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Offline Web Bundle
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Add Android Platform (if not committed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Ensure Android Permissions in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_VIDEO" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          fi

      - name: Sync Capacitor Web Assets to Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload ClipNova Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipNova-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-tests:
    name: Emulator Tests (Maestro)
    needs: build-android-apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ClipNova-Debug-APK
          path: ./apk/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Generate 10s test video with audio tone
        run: |
          ffmpeg -y -f lavfi -i testsrc=duration=10:size=720x1280:rate=30 \
            -f lavfi -i sine=frequency=440:duration=10 \
            -c:v libx264 -pix_fmt yuv420p -preset fast -crf 23 \
            -c:a aac -b:a 128k -shortest \
            /tmp/test-video.mp4

      - name: Set up KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo usermod -a -G kvm $USER || true

      - name: Run Emulator and Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            curl -Ls "https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro-$(uname -m)-linux" -o /tmp/maestro && chmod +x /tmp/maestro && sudo mv /tmp/maestro /usr/local/bin/maestro
            adb wait-for-device
            adb install -r -d /home/runner/work/novacut/novacut/apk/app-debug.apk
            adb shell pm grant com.clipnova.editor android.permission.READ_MEDIA_VIDEO
            adb shell pm grant com.clipnova.editor android.permission.READ_MEDIA_IMAGES
            adb shell pm grant com.clipnova.editor android.permission.READ_MEDIA_AUDIO
            adb shell pm grant com.clipnova.editor android.permission.RECORD_AUDIO
            adb shell mkdir -p /sdcard/Movies
            adb push /tmp/test-video.mp4 /sdcard/Movies/test-video.mp4
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/launch.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/new-project.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/play.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/split-play.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/pause-echo.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/playhead-drag.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/one-panel.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/features.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/edit-ops.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/language-switch.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/export.yaml
            /usr/local/bin/maestro test /home/runner/work/novacut/novacut/.maestro/back-button.yaml

      - name: Collect failure artifacts
        if: failure()
        run: |
          adb shell screencap -p /sdcard/failure-screenshot.png 2>/dev/null || true
          adb pull /sdcard/failure-screenshot.png ./failure-screenshot.png 2>/dev/null || true
          adb logcat -d > ./logcat.txt 2>/dev/null || true
          mkdir -p ./maestro-output
          maestro cloud --format junit --output ./maestro-output/results.xml 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-artifacts
          path: |
            failure-screenshot.png
            logcat.txt
            maestro-output/
          retention-days: 30
