name: Build ClipNova Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21 (Required for Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck Editor
        run: npm run lint

      - name: Build Offline Web Bundle
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Add Android Platform (if not committed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Ensure Android Permissions in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_VIDEO" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          fi

      - name: Sync Capacitor Web Assets to Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Fast Java Compile Check (fail fast ~2 min)
        working-directory: ./android
        run: ./gradlew :app:compileDebugJavaWithJavac

      - name: Run Native Export Unit Tests
        working-directory: ./android
        run: ./gradlew testDebugUnitTest

      - name: Upload Native Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          retention-days: 30

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload ClipNova Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipNova-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  playwright-browser-tests:
    name: Playwright Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Unit Tests (vitest)
        run: npm run test:unit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Generate Test Media
        run: |
          ffmpeg -y -f lavfi -i testsrc2=duration=10:size=720x1280:rate=30 -f lavfi -i sine=frequency=440:duration=10 -c:v libvpx-vp9 -c:a libopus -b:a 128k -shortest test-assets/test-12s.webm
          ffmpeg -y -f lavfi -i testsrc2=duration=8:size=720x1280:rate=30 -f lavfi -i sine=frequency=523:duration=8 -c:v libvpx-vp9 -c:a libopus -b:a 128k -shortest test-assets/test-8s.webm

      - name: Create test-exports directory
        run: mkdir -p test-exports

      - name: Start Dev Server
        run: |
          VITE_TEST_MODE=true npm run dev &
          sleep 5

      - name: Run Playwright Tests (excluding big-source)
        run: npx playwright test --timeout=90000 --workers=1 --reporter=line --grep-invert "big-source"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload Exported Test Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exported-test-files
          path: test-exports/
          retention-days: 30

  big-source-tests:
    name: Big Source Export Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Cache Test Fixtures
        uses: actions/cache@v4
        id: cache-fixtures
        with:
          path: test-assets/
          key: test-fixtures-v1

      - name: Generate Big Source Fixture (25s H.264+AAC 1080p ~25 MB)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: |
          mkdir -p test-assets
          ffmpeg -y -f lavfi -i testsrc2=duration=25:size=1920x1080:rate=30 -f lavfi -i sine=frequency=440:duration=25 -c:v libx264 -b:v 8M -c:a aac -b:a 128k -shortest test-assets/big-25s-1080p.mp4

      - name: Create test-exports directory
        run: mkdir -p test-exports

      - name: Start Dev Server
        run: |
          VITE_TEST_MODE=true npm run dev &
          sleep 5

      - name: Run Big Source Playwright Tests
        run: npx playwright test --timeout=90000 --workers=1 --reporter=line tests/export-big-source.spec.ts

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-source-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30
